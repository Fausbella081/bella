
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Management System</h1>
        <p>Register and manage student information</p>
    </header>

    <main class="container">

        <!-- Registration Form -->
        <section class="form-section">

            <h2 id="formTitle">Register Student</h2>

            <form id="studentForm">

                <input type="hidden" id="editId">

                <label for="studentName">Full Name</label>
                <input type="text" id="studentName"
                       placeholder="Enter student name" required>

                <label for="regNumber">Registration Number</label>
                <input type="text" id="regNumber"
                       placeholder="Enter registration number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter phone number" required>

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="department">Department</label>
                <input type="text" id="department"
                       placeholder="Enter department" required>

                <label for="level">Level</label>
                <select id="level" required>
                    <option value="">Select Level</option>
                    <option value="100 Level">100 Level</option>
                    <option value="200 Level">200 Level</option>
                    <option value="300 Level">300 Level</option>
                    <option value="400 Level">400 Level</option>
                    <option value="500 Level">500 Level</option>
                </select>

                <label for="faculty">Faculty</label>
                <input type="text" id="faculty"
                       placeholder="Enter faculty" required

                <button type="submit" id="submitBtn">
                    Register Student
                </button>

                <button type="button" id="cancelBtn" hidden>
                    Cancel Update
                </button>

            </form>

        </section>

        <!-- Registered Students -->
        <section class="records-section">

            <h2>Registered Students</h2>

            <input type="search"
                   id="searchInput"
                   placeholder="Search by name or registration number">

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>S/N</th>
                            <th>Full Name</th>
                            <th>Reg. Number</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>Department</th>
                            <th>Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>

                </table>

            </div>

            <h3 id="totalStudents">Total Students: 0</h3>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Student Management System.
            All Rights Reserved.
        </p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
